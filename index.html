<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Money Tracker</h1>
        <p>Track your income and expenses</p>
    </header>

    <main>

        <section class="card">
            <h2>Add Transaction</h2>

            <form id="transactionForm">

                <input
                    type="text"
                    id="description"
                    placeholder="Description"
                    required
                >

                <input
                    type="number"
                    id="amount"
                    placeholder="Amount"
                    required
                >

                <select id="type">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <button type="submit">
                    Add Transaction
                </button>

            </form>
        </section>

        <section class="card">
            <h2>Transactions</h2>

            <ul id="transactionList"></ul>
        </section>

    </main>

    <footer>
        <p>Money Tracker Project</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
